title: Suppose
home:
  title: Make beliefs explicit. Explore what follows.
  description: An R package and local chat workbench for inspectable beliefs, models, and scientific revisions.
  sidebar: false
template:
  bootstrap: 5
  bslib:
    bg: "#fffdf9"
    fg: "#332b39"
    primary: "#633b83"
    secondary: "#79508d"
    link-color: "#633b83"
    border-color: "#e4dce9"
    code-bg: "#f4f0f8"
    base_font: "Avenir Next, Avenir, system-ui, sans-serif"
    heading_font: "Avenir Next, Avenir, system-ui, sans-serif"
    code_font: "SFMono-Regular, Consolas, Liberation Mono, monospace"
    headings-font-weight: 600
    border-radius: 0.4rem
navbar:
  bg: light
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]
  components:
    articles:
      text: Guides
      menu:
      - text: Work in conversation
        href: articles/workbench.html
      - text: Explore a model’s world
        href: articles/model-worlds.html
      - text: Inspect prior consequences
        href: articles/prior-consequences.html
      - text: Learn from measurements
        href: articles/measurements.html
      - text: Fit and revise a regression
        href: articles/regression.html
      - text: Plan the next measurement
        href: articles/research-design.html
      - text: Continue, test and challenge a plan
        href: articles/research-loop.html
      - text: Use the terminal
        href: articles/terminal.html
      - text: Methods and limits
        href: articles/methods.html
