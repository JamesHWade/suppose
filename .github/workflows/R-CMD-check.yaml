# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

# Stop obsolete branch runs; preserve every main-branch validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  R-CMD-check:
    name: ubuntu-latest (release)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # alloptr has no public source. The tests that need it skip.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      # Check the Deputy revision Suppose was verified against, not whatever
      # Deputy's main branch is that day; deputy-main.yaml checks main. The pin
      # is written on the runner only. It goes in Remotes rather than
      # extra-packages because pak refuses two different refs for one package.
      - name: Pin Deputy to the verified revision
        shell: bash
        run: |
          sha=$(sed -n 's/^Config\/suppose\/verified-deputy-revision:[[:space:]]*//p' DESCRIPTION | tr -d '[:space:]')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=DESCRIPTION::Config/suppose/verified-deputy-revision must be one full commit SHA."
            exit 1
          fi
          sed -i -E "s/^(Remotes:[[:space:]]*|[[:space:]]+)JamesHWade\/deputy([@#][^[:space:],]*)?(,?)[[:space:]]*\$/\1JamesHWade\/deputy@${sha}\3/" DESCRIPTION
          if ! grep -Eq "^(Remotes:[[:space:]]*|[[:space:]]+)JamesHWade/deputy@${sha},?\$" DESCRIPTION; then
            echo "::error file=DESCRIPTION::Remotes must list JamesHWade/deputy so it can be pinned."
            exit 1
          fi
          echo "DEPUTY_REVISION=${sha}" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, alloptr=?ignore
          needs: check

      - name: Confirm the installed Deputy revision
        shell: Rscript {0}
        run: |
          installed <- utils::packageDescription("deputy")$RemoteSha
          expected <- Sys.getenv("DEPUTY_REVISION")
          if (!identical(installed, expected)) {
            stop("Expected Deputy ", expected, "; installed ", deparse(installed))
          }
          cat(
            "Deputy: JamesHWade/deputy@", installed, "\n",
            sep = "",
            file = Sys.getenv("GITHUB_STEP_SUMMARY"),
            append = TRUE
          )

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
